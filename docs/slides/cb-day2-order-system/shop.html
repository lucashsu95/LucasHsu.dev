<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Mart | 商品訂單</title>
    <style>
      :root {
        --ink: #182230;
        --muted: #687386;
        --paper: #f7f4ed;
        --card: #fffdf8;
        --blue: #2563eb;
        --green: #16856a;
        --line: #d9d5ca;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, #dce8ff, transparent 34%),
          var(--paper);
        font-family: Georgia, "Noto Serif TC", serif;
      }
      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 32px;
      }
      .eyebrow {
        color: var(--blue);
        font:
          700 12px/1.2 ui-monospace,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 650px;
        margin: 8px 0 0;
        font-size: clamp(2.4rem, 7vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      .intro {
        max-width: 280px;
        color: var(--muted);
        line-height: 1.7;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.5fr 0.8fr;
        gap: 24px;
        align-items: start;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .product,
      .cart {
        background: color-mix(in srgb, var(--card) 88%, transparent);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .product {
        padding: 20px;
        min-height: 170px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .product h2 {
        margin: 0;
        font-size: 1.6rem;
      }
      .meta {
        color: var(--muted);
        margin: 8px 0 20px;
      }
      .buy-row {
        display: flex;
        gap: 8px;
      }
      input {
        width: 72px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 10px;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 3px;
        padding: 10px 14px;
        color: white;
        background: var(--blue);
        cursor: pointer;
        font:
          700 14px ui-monospace,
          monospace;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .cart {
        padding: 24px;
        position: sticky;
        top: 20px;
      }
      .cart h2 {
        margin: 0 0 16px;
        font-size: 1.8rem;
      }
      .status {
        min-height: 48px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 14px;
        line-height: 1.5;
      }
      .status.success {
        color: var(--green);
      }
      .status.error {
        color: #b42318;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--muted);
      }
      @media (max-width: 760px) {
        main {
          padding-top: 28px;
        }
        header,
        .layout {
          grid-template-columns: 1fr;
          display: grid;
        }
        .products {
          grid-template-columns: 1fr;
        }
        .cart {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">Backend / SQLite / Order System</div>
          <h1>今天吃點什麼？</h1>
        </div>
        <p class="intro">
          這個頁面透過 Java API 讀取 SQLite 商品資料，購買後會即時扣除庫存。
        </p>
      </header>
      <section class="layout">
        <div id="products" class="products" aria-live="polite"></div>
        <aside class="cart">
          <h2>訂單狀態</h2>
          <div id="status" class="status">正在載入商品...</div>
        </aside>
      </section>
    </main>
    <script>
      const productsElement = document.querySelector("#products");
      const statusElement = document.querySelector("#status");

      function showStatus(message, type = "") {
        statusElement.textContent = message;
        statusElement.className = `status ${type}`;
      }

      async function loadProducts() {
        try {
          const response = await fetch("/api/products");
          if (!response.ok) throw new Error("無法讀取商品");
          const products = await response.json();
          productsElement.innerHTML = products.length
            ? products
                .map(
                  (product) => `
          <article class="product">
            <div>
              <h2>${product.name}</h2>
              <div class="meta">NT$ ${product.price} · 庫存 ${product.stock} 件</div>
            </div>
            <form class="buy-row" data-product-id="${product.id}">
              <input name="quantity" type="number" min="1" max="${product.stock}" value="1" ${product.stock === 0 ? "disabled" : ""}>
              <button type="submit" ${product.stock === 0 ? "disabled" : ""}>${product.stock === 0 ? "已售完" : "加入訂單"}</button>
            </form>
          </article>
        `,
                )
                .join("")
            : '<p class="empty">目前沒有商品。</p>';
          document
            .querySelectorAll("form[data-product-id]")
            .forEach((form) => form.addEventListener("submit", buyProduct));
        } catch (error) {
          showStatus(error.message, "error");
        }
      }

      async function buyProduct(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector("button");
        button.disabled = true;
        const data = new URLSearchParams({
          productId: form.dataset.productId,
          quantity: form.quantity.value,
        });
        try {
          const response = await fetch("/api/buy", {
            method: "POST",
            body: data,
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "購買失敗");
          showStatus(`${result.message}，庫存已更新。`, "success");
          await loadProducts();
        } catch (error) {
          showStatus(error.message, "error");
          button.disabled = false;
        }
      }

      loadProducts();
    </script>
  </body>
</html>
